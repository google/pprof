name: ci
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 2 * * *' # Run every day, at 2AM UTC.

permissions:
  contents: read

env:
  GOPATH: ${{ github.workspace }}
  WORKING_DIR: ./src/github.com/google/pprof/
jobs:
  test-mac:
    name: test-mac (${{ matrix.go }}, ${{ matrix.env.os }}, xcode ${{ matrix.env.xcode }})
    runs-on: ${{ matrix.env.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
        # Supported macOS versions can be found in
        # https://github.com/actions/runner-images#available-images.
        # Supported Xcode versions can be found in:
        # - https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md#xcode
        # - https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
        # We test the oldest and the newest Xcode of the major version that each
        # macOS version is paired with.
        env:
          - {os: 'macos-15', xcode: '16.0'}
          - {os: 'macos-15', xcode: '16.4'}
          - {os: 'macos-26', xcode: '26.0.1'}
          - {os: 'macos-26', xcode: '26.6'}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.WORKING_DIR }}

      - name: Update Go version using setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Include cache directives to allow proper caching. Without them, we
          # get setup-go "Restore cache failed" warnings.
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.env.xcode }}

      - name: Fetch dependencies
        run: |
          brew install graphviz
          # Do not let tools interfere with the main module's go.mod.
          cd && go mod init tools
          # TODO: Switch back to a tagged release once one newer than 2026.2.1
          # is out, see https://github.com/dominikh/go-tools/issues/1832.
          # 2026.2.1 can't read Go 1.27.2+ export data (version 5).
          go install honnef.co/go/tools/cmd/staticcheck@452d5bb86b45
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          # Add PATH for installed tools.
          echo "$GOPATH/bin:$PATH" >> $GITHUB_PATH

      - name: Run the script
        run: |
          go version
          ./test.sh

      # Only upload code coverage for the main repository. Forks typically
      # do not have Codecov configured, and we want to avoid failing the CI
      # run in that case.
      - name: Code coverage
        if: github.repository == 'google/pprof'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ env.WORKING_DIR }}/coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test-linux:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
        os: ['ubuntu-24.04', 'ubuntu-22.04']
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.WORKING_DIR }}

      - name: Update Go version using setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Include cache directives to allow proper caching. Without them, we
          # get setup-go "Restore cache failed" warnings.
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Check chrome for browser tests
        run: |
          google-chrome --version
          which google-chrome

      - name: Add LLVM 14.0 repository to ensure llvm-symbolizer 14.0.0+ on Ubuntu 20.04
        if: matrix.os == 'ubuntu-20.04'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
          sudo apt-get update

      - name: Install llvm-symbolizer
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-20.04" ]; then
            sudo apt-get install -y llvm-14 clang-14
            sudo update-alternatives --install /usr/bin/llvm-symbolizer llvm-symbolizer /usr/bin/llvm-symbolizer-14 100
          else
            sudo apt-get update
            sudo apt-get install -y llvm clang
          fi

      - name: Fetch dependencies
        run: |
          sudo apt-get install graphviz
          # Do not let tools interfere with the main module's go.mod.
          cd && go mod init tools
          # TODO: Switch back to a tagged release once one newer than 2026.2.1
          # is out, see https://github.com/dominikh/go-tools/issues/1832.
          # 2026.2.1 can't read Go 1.27.2+ export data (version 5).
          go install honnef.co/go/tools/cmd/staticcheck@452d5bb86b45
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          # Add PATH for installed tools.
          echo "$GOPATH/bin:$PATH" >> $GITHUB_PATH

      - name: Check llvm-symbolizer installation
        run: |
          llvm-symbolizer --version

      - name: Run the script
        run: |
          go version
          ./test.sh

      # Only upload code coverage for the main repository. Forks typically
      # do not have Codecov configured, and we want to avoid failing the CI
      # run in that case.
      - name: Code coverage
        if: github.repository == 'google/pprof'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ env.WORKING_DIR }}/coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.WORKING_DIR }}

      - name: Update Go version using setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Include cache directives to allow proper caching. Without them, we
          # get setup-go "Restore cache failed" warnings.
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Fetch Windows dependency
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: install --stop-on-first-failure graphviz llvm

      - name: Run the test
        run: |
          go version
          # This is a workaround to make graphviz installed through choco work.
          # It generates a config file to tell dot what layout engine and
          # format types are available. See
          # https://github.com/google/pprof/issues/585 for more details.
          dot -c
          go env
          go build github.com/google/pprof
          go test -v ./...
        working-directory: ${{ env.WORKING_DIR }}

  check:
    if: always()
    runs-on: ubuntu-latest
    needs:
    - test-mac
    - test-linux
    - test-windows
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
